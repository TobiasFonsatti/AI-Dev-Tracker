# Sobe a aplicação no servidor. Os valores vêm do arquivo .env, ao lado deste.
# A porta fica só em 127.0.0.1: o acesso público passa pelo proxy ou túnel.
services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
